services:
  postgres:
    image: postgres:16
    container_name: revenue-recovery-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: revenue_recovery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Santro2256

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: revenue-recovery-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: